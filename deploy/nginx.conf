# /etc/nginx/sites-available/audiobook
server {
    listen 80;
    server_name seu-dominio.com;   # ou o IP estático do Lightsail

    client_max_body_size 200M;     # igual ao MAX_UPLOAD_MB

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Progresso em tempo real (Server-Sent Events): sem buffer e com timeout longo
    location /api/progress/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
